<!doctype html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anil S. Yadav - Flutter Developer & Mobile App Engineer Portfolio" />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Critical resource hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" />

    <!-- High-priority preloads for instant parallel download -->
    <link rel="preload" href="flutter_bootstrap.js?v=2" as="script" />
    <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="canvaskit/skwasm.wasm" as="fetch" crossorigin="anonymous" />
    <link rel="modulepreload" href="main.dart.mjs" />
    <link rel="modulepreload" href="canvaskit/skwasm.js" />

    <!-- Poppins font — non-render-blocking with font-display:swap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet" />
    </noscript>

    <!-- iOS / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Anil Yadav" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <title>Anil S. Yadav | Portfolio</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #f8fafc; }
      }
      #loading-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        z-index: 99999;
        background: rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }
      #loading-bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
        box-shadow: 0 0 10px #a855f7;
        border-radius: 2px;
        animation: indeterminate 1.4s infinite ease-in-out;
      }
      @keyframes indeterminate {
        0% { left: -50%; width: 30%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-bar"></div>
    <script src="flutter_bootstrap.js?v=2" async></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js').catch(function(err) {
            console.debug('SW reg failed', err);
          });
        });
      }
    </script>
  </body>
</html>
