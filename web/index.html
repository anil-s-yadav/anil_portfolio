<!doctype html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anil S. Yadav - Flutter Developer & Mobile App Engineer Portfolio" />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Critical resource hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" />

    <!-- Poppins font — non-render-blocking with font-display:swap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet" />
    </noscript>

    <!-- iOS / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Anil Yadav" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <title>Anil S. Yadav | Portfolio</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #f8fafc; }
        #loader .spinner { border-top-color: #4f46e5; }
        #loader .loader-name { color: #0f172a; }
        #loader .loader-sub { color: #64748b; }
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(129, 140, 248, 0.15);
        border-top: 3px solid #818cf8;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-name {
        font-family: 'Poppins', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: -0.3px;
      }
      .loader-sub {
        font-family: 'Poppins', sans-serif;
        font-size: 12px;
        color: #94a3b8;
        margin-top: -14px;
      }
    </style>
  </head>
  <body>
    <!-- Minimal professional loader — disappears when Flutter renders -->
    <div id="loader">
      <div class="loader-name">Anil S. Yadav</div>
      <div class="loader-sub">Flutter Developer</div>
      <div class="spinner"></div>
    </div>

    <script>
      // Fallback: If flutter-view is attached to DOM, remove loader
      var observer = new MutationObserver(function() {
        if (document.querySelector('flutter-view')) {
          var loader = document.getElementById('loader');
          if (loader) {
            loader.style.transition = 'opacity 0.3s ease';
            loader.style.opacity = '0';
            setTimeout(function() {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }, 300);
            observer.disconnect();
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>

    <script src="flutter_bootstrap.js" async></script>

    <!-- High-priority preloads for instant parallel download -->
    <link rel="preload" href="flutter_bootstrap.js" as="script" />
    <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="canvaskit/skwasm.wasm" as="fetch" crossorigin="anonymous" />
    <link rel="modulepreload" href="main.dart.mjs" />
    <link rel="modulepreload" href="canvaskit/skwasm.js" />
  </body>
</html>
