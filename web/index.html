<!doctype html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anil S. Yadav - Flutter Developer & Mobile App Engineer Portfolio" />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Critical resource hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebase.googleapis.com" />

    <!-- Poppins font — only 3 weights -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet" />

    <!-- Preload profile photo -->
    <link rel="preload" as="image" href="assets/lib/assets/anil.png" />

    <!-- iOS / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Anil Yadav" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <title>Anil S. Yadav | Portfolio</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #f8fafc; }
        #loader .spinner { border-top-color: #4f46e5; }
        #loader .loader-name { color: #0f172a; }
        #loader .loader-sub { color: #64748b; }
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(129, 140, 248, 0.15);
        border-top: 3px solid #818cf8;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-name {
        font-family: 'Poppins', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: -0.3px;
      }
      .loader-sub {
        font-family: 'Poppins', sans-serif;
        font-size: 12px;
        color: #94a3b8;
        margin-top: -14px;
      }
    </style>
  </head>
  <body>
    <!-- Minimal professional loader — disappears when Flutter renders -->
    <div id="loader">
      <div class="loader-name">Anil S. Yadav</div>
      <div class="loader-sub">Flutter Developer</div>
      <div class="spinner"></div>
    </div>

    <script>
      // Remove loader as soon as Flutter renders its first frame
      window.addEventListener('flutter-first-frame', function() {
        var loader = document.getElementById('loader');
        if (!loader) return;
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 300);
      });
      // Safety fallback
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 300);
        }
      }, 8000);
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
